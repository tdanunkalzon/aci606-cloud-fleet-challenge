<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACI606 Cloud Fleet Dashboard</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; background:#0d1117; color:#e6edf3; }
    header { padding:22px 28px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; }
    h1 { margin:0; font-size:22px; }
    .tag { color:#8b949e; }
    main { padding:28px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .card { border:1px solid #30363d; border-radius:14px; padding:18px; background:#161b22; }
    .robot { font-size:20px; font-weight:700; margin-bottom:12px; }
    .row { display:flex; justify-content:space-between; padding:5px 0; color:#c9d1d9; }
    .bar { height:8px; background:#30363d; border-radius:99px; overflow:hidden; margin-top:7px; }
    .fill { height:100%; background:#58a6ff; }
    .empty { padding:40px; text-align:center; color:#8b949e; border:1px dashed #30363d; border-radius:14px; }
  </style>
</head>
<body>
<header>
  <div><h1>Cloud Fleet Dashboard</h1><div class="tag">ACI606 · starter</div></div>
  <div id="status" class="tag">esperando telemetría...</div>
</header>
<main>
  <div id="cards" class="cards"></div>
</main>
<script>
const cards = document.getElementById('cards');
const statusEl = document.getElementById('status');

function card(r, prediction, averageTemp){
  const battery = Math.max(0, Math.min(100, Number(r.battery)));
  return `<div class="card">
    <div class="robot">${r.robot_id}</div>
    <div class="row">
      <span>Condición predicha</span>
      <strong>${prediction?.predicted_status ?? 'Sin predicción'}</strong>
    </div>
    <div class="row"><span>Battery</span><span>${battery.toFixed(1)} %</span></div>
    <div class="bar"><div class="fill" style="width:${battery}%"></div></div>
    <div class="row"><span>Speed</span><span>${Number(r.speed).toFixed(2)}</span></div>
    <div class="row"><span>Motor temp.</span><span>${Number(r.motor_temp).toFixed(1)} °C</span></div>
    <div class="row">
      <span>Temp. promedio (hasta 10 muestras)</span>
      <span>${averageTemp === null ? 'Sin historial' : `${averageTemp.toFixed(1)} °C`}</span>
    </div>
    <div class="row"><span>Vibration</span><span>${Number(r.vibration).toFixed(2)}</span></div>
    <div class="row"><span>Obstacle</span><span>${Number(r.obstacle_distance).toFixed(2)} m</span></div>
  </div>`;
}

async function predictRobot(robot) {
  try {
    const response = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(robot),
    });

    return response.ok ? await response.json() : null;
  } catch {
    return null;
  }
}
async function getAverageTemp(robot) {
  try {
    const id = encodeURIComponent(robot.robot_id);
    const response = await fetch(`/robots/${id}/history`);
    if (!response.ok) return null;

    const history = await response.json();
    const recent = history.sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
    if (!recent.length) return null;

    const total = recent.reduce((sum, sample) => sum + Number(sample.motor_temp), 0);
    return total / recent.length;
  } catch {
    return null;
  }
}
async function refresh() {
  try {
    const response = await fetch('/robots');
    if (!response.ok) throw new Error('No se pudo cargar la flota');

    const robots = await response.json();
    const predictions = await Promise.all(robots.map(predictRobot));
    const averageTemps = await Promise.all(robots.map(getAverageTemp));
    const health = await fetch('/health')
  .then(response => response.ok ? response.json() : null)
  .catch(() => null);

const apiStatus = health?.status === 'ok'
  ? 'API operativa'
  : 'Estado de API no disponible';

statusEl.textContent = `${apiStatus} · ${robots.length} robot(s) con telemetría`;
    cards.innerHTML = robots.length
      ? robots.map((robot, index) => card(robot, predictions[index], averageTemps[index])).join('')
      : '<div class="empty">Ejecuta el simulador para comenzar a recibir robots.</div>';
  } catch {
    statusEl.textContent = 'API no disponible';
  } finally {
    setTimeout(refresh, 1500);
  }
}

refresh();
</script>
</body>
</html>
